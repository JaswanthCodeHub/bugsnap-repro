services:
  postgres:
    image: postgres:17-alpine
    container_name: bugsnap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bugsnap}
      POSTGRES_USER: ${POSTGRES_USER:-bugsnap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bugsnap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugsnap} -d ${POSTGRES_DB:-bugsnap}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugsnap_postgres_data:
